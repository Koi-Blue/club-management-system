{% extends "base.html" %}
{% block title %}审批 · {{ club_name }}{% endblock %}
{% block content %}
<header class="page-head"><div><h1>待办审批</h1><p>这里只列出需要你处理的注册、立项、活动发放、借用、报销和请假。</p></div></header>
<section class="card">
  {% if items %}
  <div class="list">
    {% for item in items %}
    <a class="item" href="{{ item.href }}"><h3>{{ item.title }}</h3><p class="muted">{{ item.kind }} · {{ item.meta }}</p></a>
    {% endfor %}
  </div>
  {% else %}<p class="empty">现在没有待你处理的事项。</p>{% endif %}
</section>
{% endblock %}
