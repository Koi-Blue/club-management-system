{% extends "base.html" %}
{% block title %}{{ post.title }} · {{ club_name }}{% endblock %}
{% block content %}
<header class="page-head">
  <div><h1>{{ post.title }}</h1><p class="muted">{{ post.scope }} · {{ post.author }} · {{ post.created_at }}</p></div>
</header>
<article class="card prose">{{ post.html | safe }}</article>
{% if post.can_delete %}
<form method="post" action="/forum/{{ post.id }}/delete" style="margin-top:0.8rem">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <button class="danger" type="submit">删除</button>
</form>
{% endif %}
{% endblock %}
