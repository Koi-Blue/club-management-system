{% extends "base.html" %}
{% block title %}{{ entry.title }} · {{ club_name }}{% endblock %}
{% block content %}
<header class="page-head">
  <div><h1>{{ entry.title }}</h1><p class="muted">{{ entry.updated_at }}</p></div>
  <a data-page-link class="secondary" href="/journal/{{ entry.id }}/edit">编辑</a>
</header>
<article class="card prose">{{ entry.html | safe }}</article>
<form method="post" action="/journal/{{ entry.id }}/delete" style="margin-top:0.8rem">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <button class="danger" type="submit">删除</button>
</form>
{% endblock %}
