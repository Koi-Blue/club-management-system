{% extends "base.html" %}
{% block title %}账号设置 · {{ club_name }}{% endblock %}
{% block content %}
<header class="page-head">
  <div>
    <h1>账号设置</h1>
    <p>{{ me.real_name }} · @{{ me.username }} · {{ me.role_text }}</p>
  </div>
</header>
<section class="grid two">
  <form class="card stack" method="post" action="/profile/password">
    <h2>修改密码</h2>
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label class="field"><span>当前密码</span><input name="current" type="password" required></label>
    <label class="field"><span>新密码</span><input name="new_password" type="password" required></label>
    <label class="field"><span>再输入一次</span><input name="confirm" type="password" required></label>
    <button class="primary" type="submit">更新密码</button>
  </form>
  {% if me.is_admin %}
  <form class="card stack" method="post" action="/profile/club">
    <h2>社团名称</h2>
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label class="field"><span>显示在导航和登录页</span><input name="club_name" value="{{ club_name }}" required></label>
    <button class="primary" type="submit">保存</button>
  </form>
  {% endif %}
</section>
{% endblock %}
