{% extends "base.html" %}
{% block title %}创建活动 · {{ club_name }}{% endblock %}
{% block content %}
<header class="page-head"><div><h1>创建活动</h1><p>保存后是待发放草稿。社长、副社长或指导老师发放后才会出现在全员列表里。</p></div></header>
<form class="card form-grid" method="post" action="/activities">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label class="field span-2"><span>活动名称</span><input name="title" required></label>
  <label class="field"><span>范围</span><select name="department">{% for scope in scopes %}<option>{{ scope }}</option>{% endfor %}</select></label>
  <label class="field"><span>地点</span><input name="location"></label>
  <label class="field"><span>开始</span><input name="start_at" type="datetime-local" required></label>
  <label class="field"><span>结束</span><input name="end_at" type="datetime-local" required></label>
  <label class="field"><span>人数上限，0 表示不限</span><input name="capacity" type="number" min="0" value="0"></label>
  <label class="field span-2"><span>说明</span><textarea name="description"></textarea></label>
  <div class="actions span-2"><button class="primary" type="submit">保存草稿</button><a class="secondary" href="/activities">返回</a></div>
</form>
{% endblock %}
