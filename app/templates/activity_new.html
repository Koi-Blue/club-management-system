{% extends "base.html" %}
{% block title %}创建活动 · {{ club_name }}{% endblock %}
{% block content %}
<header class="page-head"><div><h1>创建活动</h1><p>保存后状态是待发放。社长、副社长、指导老师或超级管理员发放后，成员才能看到并报名。</p></div></header>
<form class="card form-grid" method="post" action="/activities">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label class="field span-2"><span>活动名称</span><input name="title" required></label>
  <label class="field"><span>开始时间</span><input name="start_at" type="datetime-local" required></label>
  <label class="field"><span>结束时间</span><input name="end_at" type="datetime-local" required></label>
  <label class="field"><span>地点</span><input name="location"></label>
  <label class="field"><span>人数上限，0 表示不限</span><input name="capacity" type="number" min="0" value="0"></label>
  <label class="field span-2"><span>说明</span><textarea name="description"></textarea></label>
  <div class="actions span-2">
    <button class="primary" type="submit">提交</button>
    <a class="secondary" href="/activities">返回</a>
  </div>
</form>
{% endblock %}
