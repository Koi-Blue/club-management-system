{% extends "base.html" %}
{% block title %}编辑立项 · {{ club_name }}{% endblock %}
{% block content %}
<header class="page-head"><div><h1>编辑立项</h1><p>草稿和已驳回可以改名称、说明、部门和关联成员。部门限制与新建一样，改完还可以再提交审批。</p></div></header>
<form class="card form-grid" method="post" action="/projects/{{ project.id }}/edit">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label class="field"><span>部门</span><select name="department">{% for dept in choices %}<option {% if dept == project.department %}selected{% endif %}>{{ dept }}</option>{% endfor %}</select></label>
  <label class="field"><span>项目名称</span><input name="title" value="{{ project.title }}" required></label>
  <label class="field span-2"><span>说明</span><textarea name="summary">{{ project.summary }}</textarea></label>
  <div class="span-2">
    <p class="group-label">关联成员</p>
    <div class="roles">
      {% for person in people %}<label><input type="checkbox" name="members" value="{{ person.id }}" {% if person.checked %}checked{% endif %}>{{ person.class_name }} {{ person.real_name }}</label>{% endfor %}
    </div>
  </div>
  <div class="actions span-2"><button class="primary" type="submit">保存修改</button><a data-page-link class="secondary" href="/projects/{{ project.id }}">返回</a></div>
</form>
{% endblock %}
