{% extends "base.html" %}
{% block title %}写日记 · {{ club_name }}{% endblock %}
{% block content %}
<header class="page-head"><div><h1>{% if entry.id %}编辑日记{% else %}新日记{% endif %}</h1><p>支持标题、列表、加粗和代码块。</p></div></header>
<form class="card stack" method="post" action="/journal">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <input type="hidden" name="item_id" value="{{ entry.id }}">
  <label class="field"><span>标题</span><input name="title" value="{{ entry.title }}" required></label>
  <label class="field"><span>正文</span><textarea name="body">{{ entry.body }}</textarea></label>
  <div class="actions"><button class="primary" type="submit">保存</button><a class="secondary" href="/journal">返回</a></div>
</form>
{% endblock %}
