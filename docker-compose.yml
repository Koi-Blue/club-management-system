services:
  club:
    build: .
    image: club-management:latest
    container_name: club-management
    restart: unless-stopped
    ports:
      - "80:8000"
    env_file:
      - .env
    volumes:
      - club-data:/app/data
    # 生产机约 2 核 / 2G 且没有 swap。640m 给系统和 Docker 留出内存，1.0 CPU 留一核给系统与 SQLite。
    mem_limit: 640m
    cpus: 1.0

volumes:
  club-data:
